name: Deploy remote MCP to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloud-run.yml
      - .dockerignore
      - .nvmrc
      - Dockerfile
      - package-lock.json
      - package.json
      - src/**
      - tsconfig.json

concurrency:
  group: cdt-express-mcp-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.GCP_CLOUD_RUN_SERVICE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: deploy
        name: Deploy Cloud Run revision
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |-
            HOST=0.0.0.0
            MCP_PUBLIC_BASE_URL=https://mcp.riskthinking.ai
            MCP_ALLOWED_HOSTS=${{ vars.GCP_CLOUD_RUN_HOST }}
            MCP_TRUST_PROXY_HOPS=1
            VELO_AUTHORIZE_URL=https://velo.riskthinking.ai/mcp/authorize
            MCP_ALLOWED_ORIGINS=https://chatgpt.com\,https://claude.ai\,https://gemini.google.com
            MCP_ALLOWED_REDIRECT_ORIGINS=https://chatgpt.com\,https://claude.ai\,https://platform.claude.com\,https://gemini.google.com
            MCP_ALLOWED_CIMD_ORIGINS=https://chatgpt.com
          secrets: |-
            MCP_OAUTH_SECRET=cdt-express-mcp-oauth-secret:latest
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --port=3000
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --min-instances=1
            --max-instances=1
            --execution-environment=gen2
            --ingress=all

      - name: Verify deployed service
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error "${SERVICE_URL}/health"
