name: Deploy remote MCP to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloud-run.yml
      - .dockerignore
      - .nvmrc
      - Dockerfile
      - package-lock.json
      - package.json
      - src/**
      - scripts/smoke-remote.mjs
      - tsconfig.json

concurrency:
  group: cdt-express-mcp-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPOSITORY }}/${{ secrets.GCP_CLOUD_RUN_SERVICE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare private deployment configuration
        env:
          SERVER_ENV_JSON: ${{ secrets.MCP_DEPLOY_ENV_JSON }}
          DEPLOY_FLAGS: ${{ secrets.GCP_DEPLOY_FLAGS }}
          SERVICE_HOSTS: ${{ secrets.GCP_CLOUD_RUN_HOST }}
          FEDERATION_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const config = JSON.parse(process.env.SERVER_ENV_JSON);
          const values = [
            ...Object.values(config),
            ...process.env.SERVICE_HOSTS.split(','),
            ...[...process.env.DEPLOY_FLAGS.matchAll(/--[^=\s]+=([^\s]+)/g)].map(match => match[1]),
            ...[...process.env.FEDERATION_PROVIDER.matchAll(/projects\/([^/]+)/g)].map(match => match[1]),
          ];
          for (const value of values) {
            if (typeof value === 'string' && value.length >= 8) console.log(`::add-mask::${value}`);
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/mcp-env.json`, JSON.stringify(config), { mode: 0o600 });
          NODE

      - run: npm ci
      - run: npm test

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: candidate
        name: Resolve candidate URL
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
          BASE_ALLOWED_HOSTS: ${{ secrets.GCP_CLOUD_RUN_HOST }}
        run: |
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > "$RUNNER_TEMP/mcp-service.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const service = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/mcp-service.json`, 'utf8'));
          const url = new URL(service.status.url);
          url.hostname = `candidate---${url.hostname}`;
          const hosts = [...process.env.BASE_ALLOWED_HOSTS.split(','), url.hostname].map(value => value.trim()).filter(Boolean);
          const path = `${process.env.RUNNER_TEMP}/mcp-env.json`;
          const config = JSON.parse(readFileSync(path, 'utf8'));
          config.MCP_ALLOWED_HOSTS = [...new Set(hosts)].join(',');
          const { writeFileSync } = await import('node:fs');
          writeFileSync(path, JSON.stringify(config), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url.origin}\n`);
          NODE

      - id: deploy
        name: Deploy Cloud Run revision
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          suffix: ${{ github.sha }}
          tag: candidate
          no_traffic: true
          secrets: |-
            MCP_OAUTH_SECRET=${{ secrets.GCP_OAUTH_SECRET_NAME }}:latest
            MCP_REDIS_HOSTNAME=${{ secrets.GCP_REDIS_HOSTNAME_SECRET_NAME }}:latest
            MCP_REDIS_PASSWORD=${{ secrets.GCP_REDIS_PASSWORD_SECRET_NAME }}:latest
          flags: >-
            ${{ secrets.GCP_DEPLOY_FLAGS }}
            --env-vars-file=${{ runner.temp }}/mcp-env.json

      - name: Verify candidate OAuth and Redis access
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: node scripts/smoke-remote.mjs "$CANDIDATE_URL"

      - name: Promote verified revision
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
        run: |
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --to-revisions="$SERVICE-$GITHUB_SHA=100" --quiet

      - name: Verify public endpoint
        run: node scripts/smoke-remote.mjs https://mcp.riskthinking.ai
