name: Build and package

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      MCP_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run pack

      - name: Verify lean MCPB contents
        run: |
          unzip -Z1 cdt-express.mcpb | sort > mcpb-files.txt
          diff -u <(printf '%s\n' LICENSE build/index.mjs manifest.json) mcpb-files.txt
          test "$(stat -c%s cdt-express.mcpb)" -lt 1000000

      # Prove both entry points complete an MCP handshake and list tools.
      - run: npm run smoke
      - run: unzip -p cdt-express.mcpb build/index.mjs > /tmp/cdt-express-mcpb.mjs

      # Node 20 predates automatic ESM syntax detection, so this verifies that
      # the bundle's module type is explicit rather than inferred.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm run smoke -- /tmp/cdt-express-mcpb.mjs
