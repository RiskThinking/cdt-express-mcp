name: Build and package

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npm run pack

      # `tsc` cannot catch a module specifier that only fails to resolve at
      # runtime, so prove the packaged server actually starts and lists tools.
      - run: npm run smoke
